<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  body{margin:0;background:#0d0d12;overflow:hidden;font-family:system-ui,sans-serif;}
  #cv{width:100%;height:100vh;}
  .ctrls{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;z-index:20;}
  .btn{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-family:monospace;
    background:rgba(15,15,22,0.92);border:1px solid rgba(255,255,255,0.12);border-radius:6px;
    padding:6px 12px;color:rgba(255,255,255,0.45);cursor:pointer;transition:all .2s;text-align:center;}
  .btn:hover{border-color:#e8335a;color:#e8335a;}
  .fetch-btn{border-color:#d4af37;color:#d4af37;}
  .fetch-btn:hover{background:rgba(212,175,55,0.1);}
  
  #tip{position:absolute;background:#1a1a26;border:1px solid rgba(255,255,255,0.1);
    border-radius:10px;padding:10px 14px;font-size:13px;color:#f0f0f0;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);opacity:0;transition:opacity .2s;z-index:10;max-width:200px;
    pointer-events:auto; left:-9999px;} 
  
  #tip a:hover { color:#fff !important; text-shadow:0 0 8px rgba(79,195,247,0.8); }
  
  .hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    font-size:10px;color:rgba(255,255,255,0.18);letter-spacing:1px;font-family:monospace;
    pointer-events:none;white-space:nowrap;}
  #welcome{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:rgba(255,255,255,0.3);font-family:monospace;text-align:center;pointer-events:none;}
</style>
</head>
<body>
<div id="cv"></div>
<div id="welcome">Ready to fetch data.<br><br>Custom parser ready for your database schema.</div>
<div class="ctrls">
  <button class="btn fetch-btn" onclick="fetchData()">Load from Supabase</button>
  <button class="btn" onclick="resetTree()">Reset</button>
  <button class="btn" onclick="openLevel(1)">Lvl 1</button>
  <button class="btn" onclick="openLevel(2)">Lvl 2</button>
  <button class="btn" onclick="openLevel(3)">Lvl 3</button>
  
  <div style="display: flex; flex-direction: column; gap: 5px; background: rgba(15,15,22,0.92); border: 1px solid rgba(255,255,255,0.12); padding: 8px 10px; border-radius: 6px; margin-top: 5px;">
    <label style="font-size: 9px; color: rgba(255,255,255,0.45); font-family: monospace; text-transform: uppercase; letter-spacing: 1px;">Spread</label>
    <input type="range" min="0.5" max="3" step="0.1" value="1" oninput="updateSpacing(this.value)" style="width: 100%; cursor: pointer;">
  </div>
</div>
<div id="tip"></div>
<div class="hint">Click to expand/collapse · Drag node to reposition · Scroll to zoom</div>
<script>
const W = window.innerWidth, H = window.innerHeight;
const cx = W/2, cy = H/2;
let root = null;
let spreadFactor = 1; // New global multiplier

function updateSpacing(val) {
  spreadFactor = parseFloat(val);
  if (root) {
    // Clear fixed, dragged positions so the tree scales cleanly
    traverseAll(root, d => { d.data.ox = null; d.data.oy = null; });
    update(root);
  }
}

// Replace these with your actual Supabase credentials
const supabaseUrl = 'https://fzceflayktxyjidvkfsh.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Y2VmbGF5a3R4eWppZHZrZnNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODQyMjMsImV4cCI6MjA5NTY2MDIyM30.Yq0sdcWYzB0rQyMdXlOAwFAi1wFrHkJcdYs-0Z6uJvU';
const db = window.supabase.createClient(supabaseUrl, supabaseKey);

const colorScale = d3.scaleOrdinal(["#e8335a","#00c9a7","#9b59b6","#3a7bd5","#ff7043","#ec407a","#ab47bc","#26c6da","#66bb6a","#ffa726", "#cddc39", "#8d6e63"]);

function bcolor(d){
  if(d.id === "root") return "#d4af37";
  let c = d; 
  while(c.parent && c.parent.id !== "root") c = c.parent;
  return colorScale(c.id);
}

function nodeR(d){
  if(d.id === "root") return 32;
  const g1 = d.data.g1 || 0;
  if(g1 >= 10) return 20; if(g1 >= 7) return 17;
  if(g1 >= 4)  return 13; if(g1 >= 1) return 10;
  return 7;
}

const RADII = [0, 150, 320, 500, 680, 850, 1020];

const svg = d3.select("#cv").append("svg").attr("width",W).attr("height",H);
let zoomT = d3.zoomIdentity; 
const zoom = d3.zoom().scaleExtent([0.05, 8]).on("zoom", e => {
  zoomT = e.transform;
  g.attr("transform", zoomT);
});
svg.call(zoom);
const g = svg.append("g");

const defs = svg.append("defs");
const gf = defs.append("filter").attr("id","gl");
gf.append("feGaussianBlur").attr("stdDeviation","5").attr("result","b");
const fm = gf.append("feMerge");
fm.append("feMergeNode").attr("in","b");
fm.append("feMergeNode").attr("in","SourceGraphic");

const LG = g.append("g"); 
const NG = g.append("g"); 

let tipTimeout;
const tipEl = document.getElementById("tip");

tipEl.addEventListener("mouseenter", () => clearTimeout(tipTimeout));
tipEl.addEventListener("mouseleave", () => hideTip());

function showTip(e, d){
  clearTimeout(tipTimeout);
  const c = bcolor(d);
  
  let linkHtml = "";
  if(d.id !== "root") {
    linkHtml = `<div style="margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08);">
                  <a href="https://db.netkeiba.com/horse/${d.id}" target="_blank" style="color:#4fc3f7; text-decoration:none; font-size:11px; font-family:monospace; transition:color 0.2s;">
                    View on Netkeiba ↗
                  </a>
                </div>`;
  }

  tipEl.innerHTML=
    `<div style="font-weight:600;color:${c};font-size:14px;margin-bottom:3px">${d.data.name}</div>`+
    (d.data.g1?`<div style="color:${c};font-size:20px;font-family:monospace;line-height:1;margin-bottom:3px">${d.data.g1} G1</div>`:"") +
    (d.data.era?`<div style="color:#6b6b80;font-size:12px">${d.data.era}</div>`:"")+
    (d._children?`<div style="color:rgba(255,255,255,0.22);font-size:11px;margin-top:4px">${d.children?"Drag or click ↑":"Drag or click ↓"} (${d._children.length})</div>`:"") +
    linkHtml;
    
  tipEl.style.opacity="1";
  tipEl.style.left = (e.clientX + 15) + "px"; 
  tipEl.style.top = (e.clientY + 15) + "px"; 
}

function hideTip(){ 
  tipTimeout = setTimeout(() => {
    tipEl.style.opacity = "0"; 
    setTimeout(() => { if(tipEl.style.opacity === "0") tipEl.style.left = "-9999px"; }, 200);
  }, 250); 
}

function linkPath(s, t) {
  const mx = (s.cartX + t.cartX) / 2;
  const my = (s.cartY + t.cartY) / 2;
  const dx = t.cartX - s.cartX;
  const dy = t.cartY - s.cartY;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const bow = len * 0.08;
  return `M${s.cartX},${s.cartY}Q${mx - dy/len * bow},${my + dx/len * bow} ${t.cartX},${t.cartY}`;
}

function redrawLinksFast() {
  LG.selectAll("path").attr("d", d => linkPath(d.source, d.target));
}

let isDragging = false;

function update(source) {
  if(!root) return;
  const tree = d3.tree().size([2 * Math.PI, 680]);
  tree(root);

  const nodes = root.descendants();
  const links = root.links();

  nodes.forEach(d => {
    // Multiply the radius by our new spreadFactor slider
    d.y = RADII[Math.min(d.depth, RADII.length - 1)] * spreadFactor;
    if (d.data.ox != null) {
      d.cartX = d.data.ox;
      d.cartY = d.data.oy;
    } else {
      d.cartX = cx + d.y * Math.cos(d.x - Math.PI / 2);
      d.cartY = cy + d.y * Math.sin(d.x - Math.PI / 2);
    }
  });

  const nd = NG.selectAll("g.nd").data(nodes, d => d.id);

  const drag = d3.drag()
    .subject((e, d) => ({ x: d.cartX, y: d.cartY })) 
    .on("start", (e, d) => {
      isDragging = false;
      e.sourceEvent.stopPropagation();
    })
    .on("drag", (e, d) => {
      isDragging = true;
      d.data.ox = e.x;
      d.data.oy = e.y;
      d.cartX = e.x;
      d.cartY = e.y;
      d3.select(NG.selectAll("g.nd").filter(n => n.id === d.id).node())
        .attr("transform", `translate(${d.cartX},${d.cartY})`);
      redrawLinksFast();
    })
    .on("end", (e, d) => {
      if (!isDragging) {
        if (d._children) {
          d.children = d.children ? null : d._children;
          d.data.ox = null;
          d.data.oy = null;
          update(d);
        }
      }
    });

  const enter = nd.enter().append("g").attr("class", "nd")
    .attr("transform", d => `translate(${source.cartX0 || cx},${source.cartY0 || cy})`)
    .call(drag)
    .on("mouseover", (e, d) => {
      showTip(e, d);
      d3.select(e.currentTarget).select(".main-node")
        .transition().duration(200)
        .attr("r", nodeR(d) * 1.3);
    })
    .on("mouseout", (e, d) => {
      hideTip();
      d3.select(e.currentTarget).select(".main-node")
        .transition().duration(250)
        .attr("r", nodeR(d));
    })
    .attr("opacity", 0);

  enter.filter(d => d.id === "root").append("circle")
    .attr("r", 52).attr("fill", "none").attr("stroke", "#d4af37")
    .attr("stroke-width", 0.5).attr("opacity", 0.15).attr("filter", "url(#gl)");
  
  enter.append("circle")
    .attr("class", "main-node")
    .attr("r", d => nodeR(d))
    .attr("fill", d => (d.data.g1 > 0 || d.id === "root") ? bcolor(d) : "transparent")
    .attr("fill-opacity", d => d.id === "root" ? 0.9 : (d.data.g1 > 0 ? 0.78 : 0.15))
    .attr("stroke", d => bcolor(d)).attr("stroke-width", d => d.id === "root" ? 0 : 1.5)
    .attr("stroke-opacity", 0.7)
    .attr("filter", d => (d.id === "root" || d.data.g1 >= 5) ? "url(#gl)" : null);

  enter.append("text").text(d => d.data.name)
    .attr("dy", d => nodeR(d) + 14).attr("text-anchor", "middle")
    .attr("font-size", d => d.id === "root" ? "14px" : (d.data.g1 >= 5 ? "12px" : "10px"))
    .attr("font-weight", d => (d.id === "root" || d.data.g1 >= 5) ? "800" : "600")
    .attr("fill", d => d.id === "root" ? "#fff" : (d.data.g1 > 0 ? bcolor(d) : "rgba(255,255,255,0.75)"))
    .attr("pointer-events", "none");

  enter.filter(d => d.data.g1 >= 2).append("text").text(d => d.data.g1 + "G1")
    .attr("dy", d => -nodeR(d) - 6).attr("text-anchor", "middle")
    .attr("font-size", "10px").attr("font-family", "monospace").attr("font-weight", "800")
    .attr("fill", d => bcolor(d)).attr("pointer-events", "none");

  enter.filter(d => d._children).append("text")
    .attr("class", "pm")
    .attr("text-anchor", "middle").attr("dominant-baseline", "central")
    .attr("font-size", "12px").attr("fill", d => bcolor(d)).attr("fill-opacity", 0.65)
    .attr("pointer-events", "none")
    .text(d => d.children ? "−" : "+");

  const updateNodes = enter.merge(nd);

  updateNodes.transition().duration(400)
    .attr("transform", d => `translate(${d.cartX},${d.cartY})`)
    .attr("opacity", 1);

  updateNodes.select("text.pm").text(d => d.children ? "−" : "+");

  nd.exit().transition().duration(400)
    .attr("transform", d => `translate(${source.cartX},${source.cartY})`)
    .attr("opacity", 0)
    .remove();

  const lk = LG.selectAll("path").data(links, d => d.source.id + "-" + d.target.id);

  lk.enter().append("path")
    .attr("fill", "none")
    .attr("stroke", d => bcolor(d.target))
    .attr("stroke-width", d => d.source.id === "root" ? 2 : 1.3)
    .attr("stroke-opacity", 0)
    .attr("d", d => {
      const o = { cartX: source.cartX0 || cx, cartY: source.cartY0 || cy };
      return linkPath(o, o);
    })
    .merge(lk)
    .transition().duration(400)
    .attr("stroke-opacity", d => d.source.id === "root" ? 0.55 : 0.35)
    .attr("d", d => linkPath(d.source, d.target));

  lk.exit().transition().duration(400)
    .attr("stroke-opacity", 0)
    .attr("d", d => {
      const o = { cartX: source.cartX, cartY: source.cartY };
      return linkPath(o, o);
    })
    .remove();

  nodes.forEach(d => {
    d.cartX0 = d.cartX;
    d.cartY0 = d.cartY;
  });
}

function traverseAll(node, callback) {
  callback(node);
  if (node._children) node._children.forEach(c => traverseAll(c, callback));
}

function resetTree(){
  if(!root) return;
  traverseAll(root, d => {
    if(d.id !== "root") d.children = null;
    d.data.ox = null; d.data.oy = null;
  });
  update(root);
}

function openLevel(max){
  if(!root) return;
  traverseAll(root, d => {
    if(d.depth < max && d._children) {
      d.children = d._children;
    } else {
      d.children = null;
    }
    d.data.ox = null; d.data.oy = null;
  });
  update(root);
}

// New fetch function replacing the file upload logic
async function fetchData() {
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'block';
  welcome.innerHTML = "Fetching data from Supabase...<br><br>Hang tight.";

  const { data: raw, error } = await db
    .from('pedigrees')
    .select('*');

  if (error) {
    console.error(error);
    welcome.innerHTML = "Well, that failed. Check your console.";
    return;
  }

  welcome.style.display = 'none';
  
  if (!raw || raw.length === 0) {
      alert("No data found in the pedigrees table.");
      return;
  }

  try {
    const nodes = {};
    const g1Counts = {};
    const eras = {};
    
    raw.forEach(d => {
      const hId = d.horse_id;
      if (!hId) return;
      
      g1Counts[hId] = (g1Counts[hId] || 0) + 1;
      
      if (d.race_date) {
          const year = parseInt(d.race_date.split("-")[0]);
          if(!eras[hId]) eras[hId] = {min: year, max: year};
          else {
              eras[hId].min = Math.min(eras[hId].min, year);
              eras[hId].max = Math.max(eras[hId].max, year);
          }
      }
    });
    
    raw.forEach(d => {
      const hId = d.horse_id ? String(d.horse_id).trim() : null;
      const sId = d.sire_id && d.sire_id !== "nan" ? String(d.sire_id).trim() : null;
      const ssId = d.sire_sire_id && d.sire_sire_id !== "nan" ? String(d.sire_sire_id).trim() : null;

      if (ssId && !nodes[ssId]) {
        nodes[ssId] = {id: ssId, pid: null, name: d.sire_sire_name ? d.sire_sire_name.trim() : "Unknown", g1: 0, era: ""};
      }
      
      if (sId) {
        if (!nodes[sId]) {
          nodes[sId] = {id: sId, pid: ssId || null, name: d.sire_name ? d.sire_name.trim() : "Unknown", g1: 0, era: ""};
        } else if (!nodes[sId].pid && ssId) {
          nodes[sId].pid = ssId; 
        }
      }
      
      if (hId) {
        if (!nodes[hId]) {
          const eraObj = eras[hId];
          const eraStr = eraObj ? (eraObj.min === eraObj.max ? `${eraObj.min}` : `${eraObj.min}-${eraObj.max}`) : "";
          nodes[hId] = {id: hId, pid: sId || null, name: d.horse_name ? d.horse_name.trim() : "Unknown", g1: g1Counts[hId], era: eraStr};
        } else {
          const eraObj = eras[hId];
          nodes[hId].era = eraObj ? (eraObj.min === eraObj.max ? `${eraObj.min}` : `${eraObj.min}-${eraObj.max}`) : nodes[hId].era;
          nodes[hId].g1 = g1Counts[hId];
          if (!nodes[hId].pid && sId) nodes[hId].pid = sId;
        }
      }
    });
    
    const flatData = [{id: "root", pid: "", name: "All Thoroughbreds", g1: 0, era: "Origin"}];
    Object.values(nodes).forEach(n => {
       if (!n.pid || n.pid === n.id) n.pid = "root";
       flatData.push(n);
    });
    
    const stratify = d3.stratify().id(d => d.id).parentId(d => d.pid || null);
    root = stratify(flatData);
    
    root.each(d => {
      d._children = d.children; 
      d.data.ox = null; d.data.oy = null;
    });
    
    traverseAll(root, d => { if (d.id !== "root") d.children = null; });
    
    root.cartX0 = cx; root.cartY0 = cy;
    update(root);
    
    svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(0.3).translate(-W/2, -H/2));
    
  } catch(err) {
    alert("Error parsing database data. Check the console for details.");
    console.error(err);
  }
}
fetchData();
</script>
</body>
</html>
